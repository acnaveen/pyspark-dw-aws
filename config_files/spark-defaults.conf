# --- Packages (downloaded from Maven on first session start) ---
spark.jars.packages                              io.delta:delta-spark_2.13:4.4.1,org.apache.hadoop:hadoop-aws:3.4.1,software.amazon.awssdk:bundle:2.24.6

# --- Delta Lake ---
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Hive metastore (Postgres, configured in hive-site.xml) ---
spark.sql.catalogImplementation                  hive
# spark.sql.warehouse.dir is set in the 99_* notebooks from the S3_BUCKET_NAME env var (see lib/aws_s3.py)

# --- S3 credentials: env vars, ~/.aws/credentials, or container/instance role ---
spark.hadoop.fs.s3a.aws.credentials.provider     software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider

# --- Resources ---
spark.driver.memory                              4g